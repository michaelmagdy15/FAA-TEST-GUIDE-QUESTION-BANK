<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="rgba(56, 189, 248, 0.25)"/>
      <stop offset="1" stop-color="rgba(56, 189, 248, 0)"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(56, 189, 248, 0.3)"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#glow)"/>
  <!-- Border accent -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <!-- Decorative stars -->
  <circle cx="100" cy="130" r="4" fill="rgba(56, 189, 248, 0.6)"/>
  <circle cx="140" cy="90" r="2.5" fill="rgba(167, 139, 250, 0.5)"/>
  <circle cx="400" cy="110" r="3" fill="rgba(56, 189, 248, 0.5)"/>
  <circle cx="420" cy="400" r="3" fill="rgba(167, 139, 250, 0.4)"/>
  <circle cx="90" cy="380" r="3" fill="rgba(56, 189, 248, 0.4)"/>
  <circle cx="360" cy="80" r="2" fill="rgba(255, 255, 255, 0.3)"/>
  <!-- Paper airplane / vector shape -->
  <g filter="url(#shadow)">
    <path d="M100 155 L420 256 L100 357 L100 290 L290 256 L100 222 Z" fill="url(#plane)"/>
  </g>
  <path d="M100 290 L290 256 L100 222" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round" opacity="0.7"/>
  <path d="M100 155 L420 256 L100 357" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="6" stroke-linejoin="round"/>
  <!-- Subtle "ATPL" text -->
  <text x="256" y="420" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="url(#accent)" opacity="0.8" letter-spacing="8">ATPL</text>
</svg>
